<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeatherMap - Check current weather on an interactive map">
    <title>WeatherMap | Live Weather</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="style.css">
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>WeatherMap</h1>
        <p>Discover the weather anywhere in the world.</p>
    </header>

    <main class="container">
        <section class="search-section" aria-label="Search for weather">
            <form id="weatherForm">
                <label for="locationInput">Enter a city or location</label>

                <div class="search-controls">
                    <input
                        type="text"
                        id="locationInput"
                        placeholder="e.g. Khartoum, Sudan"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="searchButton">
                        Get Weather
                    </button>
                </div>
            </form>
            <div class="favorites-section">
    <h2>Favorite Cities</h2>

            <div id="favoritesList" class="favorites-list"></div>

              <button type="button" id="addFavoriteButton" disabled>
                Add Current City to Favorites
              </button>
            </div>

            <div id="loading" class="loading hidden" role="status">
                <span class="spinner"></span>
                <span>Loading weather data...</span>
            </div>

            <div id="message" class="message hidden" role="alert"></div>
            <section id="weatherResult" class="weather-result hidden"
                aria-live="polite"></section>
                <button type="button" id="shareWeatherButton" hidden>
                   Share Weather
                </button>
                <section id="forecastSection" class="forecast-section hidden">
                   <h2>5-Day Weather Forecast</h2>
                   <div id="forecastList" class="forecast-list"></div>
                </section>

        </section>

        <section class="chat-section" aria-label="AI Weather Assistant">
    <h2>AI Weather Assistant 🤖</h2>
    <p>Ask a question about weather.</p>

    <div id="chatMessages" class="chat-messages" aria-live="polite">
        <p class="bot-message">
            Hello! Ask me a question about weather.
        </p>
    </div>

    <form id="chatForm">
        <label for="chatInput">Your question</label>

        <div class="chat-controls">
            <input
                type="text"
                id="chatInput"
                placeholder="e.g. What is humidity?"
                required
            >

            <button type="submit" id="chatSendButton">
                Send
            </button>
        </div>
    </form>
        </section>
        <section class="map-section" aria-label="Interactive weather map">
            <h2>Weather Map</h2>
            <div id="map" aria-label="Interactive map"></div>
            
        </section>
    </main>

    <footer class="page-footer">
        <p>WeatherMap &copy; 2026 | Weather information for your location</p>
    </footer>
</body>
</html>
